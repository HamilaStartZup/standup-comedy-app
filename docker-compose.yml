version: "3.8"

services:
  backend:
    build: ./server
    container_name: standup_backend_prod
    ports:
      - "5000:3001"
    restart: always

  frontend:
    build: ./client
    container_name: standup_frontend_prod
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: always
